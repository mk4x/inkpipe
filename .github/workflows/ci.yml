name: CI

# Decision 22: pushes go straight to main, so the real gate is the pre-push
# hook on the developer machine. This workflow is the backstop that catches what
# a `--no-verify` push or a different machine let through.
#
# Model evals are deliberately absent: they need a GPU that GitHub runners do
# not have. `npm run eval` runs them locally against the golden corpus, and ADR
# 0001 records why that split exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary desktop target, Linux is the VPS target.
        # Both are first class, so both run the full suite.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          # check-doc-drift compares against origin/main, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Self-test first: a checker that cannot detect its own target passes
      # every scan and protects nothing.
      - name: Em dash checker self-test
        shell: bash
        run: bash scripts/check-em-dashes.sh --self-test

      - name: Em dash check
        shell: bash
        run: bash scripts/check-em-dashes.sh

      - name: Documentation drift
        shell: bash
        run: bash scripts/check-doc-drift.sh

      - name: Tests
        run: npm test

  corpus-replay:
    name: corpus scorer (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The scorer and the degeneracy gate are deterministic, so they are tested
      # here even though the model behind them is not available.
      - name: Scorer self-check
        run: node packages/corpus/selfcheck.mjs
